<script>
  (() => {
    const root = document.getElementById('bastion-v2-plan');
    const summary = root.querySelector('#bastion-level-summary');
    const title = root.querySelector('#bastion-plan-title');
    const copy = {
      ground: {
        title: 'Bastion v2, первый этаж',
        summary:
          'Путь операции: площадь → атриум → архив → эвакуация через служебный двор.',
      },
      roof: {
        title: 'Bastion v2, крыша',
        summary:
          'Две независимые позиции контролируют разные сектора. Боеприпасов на крыше нет.',
      },
    };
    root.querySelectorAll('[data-level]').forEach((button) => {
      button.addEventListener('click', () => {
        const level = button.dataset.level;
        root.querySelectorAll('[data-level]').forEach((item) => {
          const selected = item === button;
          item.setAttribute('aria-pressed', String(selected));
          item.classList.toggle('btn-primary', selected);
        });
        root.querySelectorAll('[data-floor]').forEach((floor) => {
          floor.toggleAttribute('hidden', floor.dataset.floor !== level);
        });
        title.textContent = copy[level].title;
        summary.textContent = copy[level].summary;
      });
    });
  })();
</script>
