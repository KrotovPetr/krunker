<style>
  #game-map-plans {
    color: var(--foreground);
    width: 100%;
  }
  #game-map-plans [hidden] {
    display: none;
  }
  #game-map-plans .viz-controls {
    margin-bottom: 10px;
  }
  #game-map-summary {
    color: var(--muted-foreground);
    margin: 8px 0 4px;
  }
  #game-map-plans svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 560px;
  }
  #game-map-plans text {
    fill: var(--foreground);
    font-size: 12px;
    text-anchor: middle;
  }
  #game-map-plans .arena {
    fill: color-mix(in srgb, var(--muted) 32%, transparent);
    stroke: var(--border);
    stroke-width: 2;
  }
  #game-map-plans .zone {
    stroke: var(--border);
    stroke-width: 1.5;
  }
  #game-map-plans .zone-primary {
    fill: color-mix(in srgb, var(--viz-series-1) 18%, transparent);
  }
  #game-map-plans .zone-secondary {
    fill: color-mix(in srgb, var(--viz-series-2) 16%, transparent);
  }
  #game-map-plans .zone-tertiary {
    fill: color-mix(in srgb, var(--viz-series-3) 16%, transparent);
  }
  #game-map-plans .solid {
    fill: var(--muted);
    stroke: var(--border);
    stroke-width: 1;
  }
  #game-map-plans .cover {
    fill: color-mix(in srgb, var(--foreground) 22%, transparent);
    stroke: var(--border);
  }
  #game-map-plans .upper {
    fill: color-mix(in srgb, var(--viz-series-4) 20%, transparent);
    stroke: var(--viz-series-4);
    stroke-width: 1.5;
    stroke-dasharray: 5 4;
  }
  #game-map-plans .route {
    fill: none;
    stroke-width: 4;
    marker-end: url(#map-arrow-a);
  }
  #game-map-plans .route-a {
    stroke: var(--viz-series-1);
    marker-end: url(#map-arrow-a);
  }
  #game-map-plans .route-b {
    stroke: var(--viz-series-2);
    marker-end: url(#map-arrow-b);
  }
  #game-map-plans .route-c {
    stroke: var(--viz-series-3);
    marker-end: url(#map-arrow-c);
  }
  #game-map-plans .dashed {
    stroke-dasharray: 8 6;
  }
  #game-map-plans .zone-label {
    font-weight: 500;
  }
  #game-map-plans .minor {
    fill: var(--muted-foreground);
  }
  #game-map-plans .north {
    fill: var(--muted-foreground);
  }
  #game-map-plans .callout {
    fill: var(--primary);
    stroke: var(--primary-foreground);
    stroke-width: 1;
  }
  #game-map-plans .callout-text {
    fill: var(--primary-foreground);
    font-weight: 500;
  }
  #game-map-plans .target {
    fill: var(--viz-series-1);
  }
  #game-map-plans .vertical-label {
    transform: rotate(-90deg);
    transform-origin: 118px 226px;
  }
  #game-map-plans .map-legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 18px;
    color: var(--muted-foreground);
  }
  #game-map-plans .map-legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  #game-map-plans .legend-line {
    display: inline-block;
    width: 24px;
    height: 3px;
  }
  #game-map-plans .legend-a {
    background: var(--viz-series-1);
  }
  #game-map-plans .legend-b {
    background: var(--viz-series-2);
  }
  #game-map-plans .legend-c {
    background: var(--viz-series-3);
  }
  #game-map-plans .legend-callout {
    display: inline-grid;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--primary);
    color: var(--primary-foreground);
    font-style: normal;
  }
  @media (max-width: 520px) {
    #game-map-plans .map-legend {
      justify-content: flex-start;
    }
  }
</style>

<script>
  (() => {
    const root = document.getElementById('game-map-plans');
    const summary = root.querySelector('#game-map-summary');
    const title = root.querySelector('#game-map-title');
    const descriptions = {
      bastion: {
        title: 'Предлагаемый план Bastion',
        summary:
          'Операция и волны. Последовательная оборона от площади к архиву и служебному двору.',
      },
      sandgate: {
        title: 'Предлагаемый план Sandgate',
        summary:
          'PvP и FFA. Три маршрута с разной дистанцией боя и дорогой безопасной ротацией.',
      },
      switchyard: {
        title: 'Предлагаемый план Switchyard',
        summary:
          'Обучение. Изолированный тир, маршрут движения и короткий комбинированный экзамен.',
      },
    };
    root.querySelectorAll('[data-map]').forEach((button) => {
      button.addEventListener('click', () => {
        const selected = button.dataset.map;
        root.querySelectorAll('[data-map]').forEach((item) => {
          const active = item === button;
          item.setAttribute('aria-pressed', String(active));
          item.classList.toggle('btn-primary', active);
        });
        root.querySelectorAll('[data-plan]').forEach((plan) => {
          plan.toggleAttribute('hidden', plan.dataset.plan !== selected);
        });
        title.textContent = descriptions[selected].title;
        summary.textContent = descriptions[selected].summary;
      });
    });
  })();
</script>
